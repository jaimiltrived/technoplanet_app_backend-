version: '3.8'

services:
  database:
    image: mysql:8.0
    container_name: technoplanet_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: rku_app
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: .
    container_name: technoplanet_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "mysql://root:rootpassword@database:3306/rku_app"
      JWT_SECRET: "production_jwt_secret_key_change_me"
      JWT_EXPIRES_IN: "7d"
    depends_on:
      - database

volumes:
  mysql_data:

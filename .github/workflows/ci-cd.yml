name: CI/CD Pipeline - RKU Technoplanet API

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    name: Lint & Automated Unit Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Code Syntax & Lint Check
        run: npm run lint

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run API Health & Unit Tests
        run: npm test

  docker-build:
    name: Docker Image Build & Verification
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: rku-technoplanet-backend:latest

  deploy:
    name: Continuous Deployment (https://api.techno.rku.ac.in/)
    needs: [lint-and-test, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Mode 1: SSH Automated Server Deployment (Standard VPS / Dedicated Server)
      - name: Deploy to Remote Server via SSH
        if: ${{ secrets.SERVER_HOST != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd ${{ secrets.TARGET_DIR || '/var/www/rku-backend' }}
            chmod +x scripts/deploy-server.sh
            bash scripts/deploy-server.sh

      # Mode 2: Webhook Triggered Deployment (GitHub Webhook / PaaS / Auto-Deploy Listener)
      - name: Trigger Webhook Auto-Deployment
        if: ${{ secrets.DEPLOY_WEBHOOK_URL != '' }}
        run: |
          curl -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}"
